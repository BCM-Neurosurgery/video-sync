# Use one raw NEV/NS5 pair as the synchronized output window.
output_dir: "/path/to/output"
channel_name: "RoomMic2"
keep_intermediates: false

jobs:
  - name: "NSP1-20260217-091906-001"
    window: neural
    neural:
      kind: pair
      nev_path: "/path/to/NSP1-20260217-091906-001.nev"
      ns5_path: "/path/to/NSP1-20260217-091906-001.ns5"
      time_anchor:
        # Raw recordings use the paired NS5 header and first data packet.
        kind: paired_ns5
    video:
      kind: directory
      directory: "/path/to/VIDEO"
      # Omit camera_serials to process every overlapping camera.
      camera_serials: ["18486638", "23512014"]
