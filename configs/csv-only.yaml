# Write one CSV per discovered video group, combining its cameras.
# Output: <output_dir>/<group_name>/<group_name>_serial_sync.csv.
# Paths in the CSV are relative to patient_dir; patient_id comes from its name.
output_dir: "/path/to/output"
csv_only: true
patient_dir: "/path/to/EXAMPLEDatafile"

jobs:
  - window: video
    video:
      kind: directory
      directory: "/path/to/EXAMPLEDatafile/VIDEO"
    neural:
      kind: directory
      directory: "/path/to/EXAMPLEDatafile/DATA"
      recursive: true
      include: ["NSP1-*"]
      time_anchor:
        kind: first_raw_nev
        # Omit reference paths to find each raw split's matching -001.nev.
        # Recording-start and clock validation still apply.
    coverage: require_full

# Uses existing corrected serials and interpolated NEV timestamps.
# Existing missing-frame rows retain source_mp4_frame_idx=-1 and have blank
# real_times/frame_id. Original rows omitted by the matcher remain omitted.
