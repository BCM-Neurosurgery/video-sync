# Write <output_dir>/<job.name>/<job.name>_serial_sync.csv.
# Paths in the CSV are relative to patient_dir; patient_id comes from its name.
output_dir: "/path/to/output"
csv_only: true
patient_dir: "/path/to/EXAMPLEDatafile"

jobs:
  - name: "camera-demo"
    window: video
    video:
      kind: file
      mp4_path: "/path/to/EXAMPLEDatafile/VIDEO/20260101/EXAMPLEDatafile_20260101_120000.00000001.mp4"
    neural:
      kind: directory
      directory: "/path/to/EXAMPLEDatafile/DATA/20260101-120000"
      include: ["NSP1-*"]
      time_anchor:
        kind: first_raw_nev
        reference_path: "/path/to/EXAMPLEDatafile/DATA/20260101-120000/NSP1-20260101-120000-001.nev"
    coverage: require_full

# Uses existing corrected serials and interpolated NEV timestamps.
# Existing missing-frame rows retain source_mp4_frame_idx=-1 and have blank
# real_times/frame_id. Original rows omitted by the matcher remain omitted.
