# Use one stitched NEV/NS5 pair as the synchronized output window.
output_dir: "/path/to/output"
channel_name: "RoomMic2"
keep_intermediates: false

jobs:
  - name: "EMU-0159_convo"
    window: neural
    neural:
      kind: pair
      nev_path: "/path/to/EMU-0159_convo-NSP-1.nev"
      ns5_path: "/path/to/EMU-0159_convo-NSP-1.ns5"
      time_anchor:
        # Point to the first raw NEV used to construct the stitched timeline.
        kind: first_raw_nev
        reference_path: "/path/to/NSP1-first-raw.nev"
    video:
      kind: directory
      directory: "/path/to/VIDEO"
      # Omit camera_serials to process every overlapping camera.
      camera_serials: ["18486638", "23512014"]
