# Canonical configuration for exact neural sessions.
output_dir: "/path/to/output"
channel_name: "RoomMic2"
keep_intermediates: false

# Shared camera selection. Omit camera_serials to auto-detect cameras from the
# JSON files that overlap each neural session.
video:
  kind: discover
  recording_dir: "/path/to/VIDEO"
  camera_serials: ["18486638", "23512014"]

sessions:
  # Raw pair: the paired NS5 header and first packet define UTC.
  - name: "raw-001"
    nev_path: "/path/to/NSP1-001.nev"
    ns5_path: "/path/to/NSP1-001.ns5"
    time_anchor:
      kind: paired_ns5

  # Stitched pair: reference the first raw NEV used by the stitched timeline.
  - name: "stitched-convo"
    nev_path: "/path/to/convo-NSP-1.nev"
    ns5_path: "/path/to/convo-NSP-1.ns5"
    time_anchor:
      kind: first_raw_nev
      reference_path: "/path/to/first-raw.nev"

    # Optional per-session override selecting exact camera files. The MP4 key
    # must match the camera serial encoded in its filename.
    video:
      kind: explicit
      json_path: "/path/to/YFVDatafile_20260217_091320.json"
      mp4_paths:
        "18486638": "/path/to/YFVDatafile_20260217_091320.18486638.mp4"

# Optional shared processing settings:
# ns3_sidecar: true
# gpu_enabled: true
# gpu_type: "nvidia"
