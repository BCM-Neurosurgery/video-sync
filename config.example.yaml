# Camera serial number
# Refer to README for available camera serial numbers
# Has to be a list of one or multiple camera serial numbers
cam_serial: ["23512014"]

# Absolute paths to stitched directory and camera recording directory
# The stitched directory contains the stitched NSP files
# The camera recording directory contains date folders with camera recordings
# On Linux, use single forward slashes as shown below
# On Windows, use double backslashes e.g. "C:\\Users\\user\\Desktop\\data"
nsp_dir: "/mnt/stitched/EMU-18112/YFK/EMU-0036_urge"
cam_recording_dir: "/mnt/datalake/data/emu/YFKDatafile/VIDEO"

# Optional: first raw NEV used to create a stitched NSP session. Supplying it
# calibrates the stitched timestamp window for automatic camera discovery.
# first_nev_path: "/mnt/datalake/data/emu/YFKDatafile/DATA/.../NSP1-....nev"

# Paths for the output files
# Final outputs: <output_dir>/<task>/<task>_<camera_serial>.mp4 and one combined
# <output_dir>/<task>/<task>_frame_mapping.csv containing all processed cameras.
output_dir: "/home/auto/CODE/utils/video-sync/Testing/YFKTesting"

# Channel name for the audio data
# Do not change this
channel_name: "RoomMic2"

# Optional: emit an HDF5 sidecar with ALL NS3 channels aligned to the synced
# video. The .ns3 file is auto-discovered next to the .nev/.ns5 (same naming).
# ns3_sidecar: true

# Optional: keep per-camera intermediates (silent subclips, extracted WAVs,
# per-input muxed clips, concat list). Default true preserves them. Set false
# to delete them after the final MP4s and combined frame-mapping CSV are written.
# keep_intermediates: false
