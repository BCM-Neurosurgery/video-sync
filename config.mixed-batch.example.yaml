# Process raw, stitched, and exact-video jobs in one invocation.
output_dir: "/path/to/output"
channel_name: "RoomMic2"
keep_intermediates: false

# Default camera discovery shared by jobs without their own `video` block.
# The directory is indexed once and reused for those jobs.
video:
  kind: directory
  directory: "/path/to/VIDEO"
  camera_serials: ["18486638", "23512014"]

jobs:
  # Raw pair using the shared camera discovery.
  - name: "NSP1-20260217-091906-001"
    window: neural
    neural:
      kind: pair
      nev_path: "/path/to/NSP1-20260217-091906-001.nev"
      ns5_path: "/path/to/NSP1-20260217-091906-001.ns5"
      time_anchor:
        kind: paired_ns5

  # Stitched pair using the shared camera discovery.
  - name: "EMU-0159_convo"
    window: neural
    neural:
      kind: pair
      nev_path: "/path/to/EMU-0159_convo-NSP-1.nev"
      ns5_path: "/path/to/EMU-0159_convo-NSP-1.ns5"
      time_anchor:
        kind: first_raw_nev
        reference_path: "/path/to/NSP1-first-raw.nev"

  # One MP4 defines the output window and discovers overlapping raw NSP pairs.
  - name: "YFVDatafile_20260217_091320"
    window: video
    video:
      kind: file
      mp4_path: "/path/to/YFVDatafile_20260217_091320.18486638.mp4"
    neural:
      kind: directory
      directory: "/path/to/DATA"
      recursive: true
      include: ["NSP1-*"]
      time_anchor:
        kind: paired_ns5
    coverage: require_full
