# Process raw, stitched, and exact-video sessions in one invocation.
output_dir: "/path/to/output"
channel_name: "RoomMic2"
keep_intermediates: false

# Default camera discovery shared by sessions without their own `video` block.
# The directory is indexed once and reused for those sessions.
video:
  kind: discover
  recording_dir: "/path/to/VIDEO"
  camera_serials: ["18486638", "23512014"]

sessions:
  # Raw pair using the shared camera discovery.
  - name: "NSP1-20260217-091906-001"
    nev_path: "/path/to/NSP1-20260217-091906-001.nev"
    ns5_path: "/path/to/NSP1-20260217-091906-001.ns5"
    time_anchor:
      kind: paired_ns5

  # Stitched pair using the shared camera discovery.
  - name: "EMU-0159_convo"
    nev_path: "/path/to/EMU-0159_convo-NSP-1.nev"
    ns5_path: "/path/to/EMU-0159_convo-NSP-1.ns5"
    time_anchor:
      kind: first_raw_nev
      reference_path: "/path/to/NSP1-first-raw.nev"

  # Raw pair restricted to one exact camera recording.
  - name: "NSP1-20260217-091906-002"
    nev_path: "/path/to/NSP1-20260217-091906-002.nev"
    ns5_path: "/path/to/NSP1-20260217-091906-002.ns5"
    time_anchor:
      kind: paired_ns5
    video:
      kind: explicit
      json_path: "/path/to/YFVDatafile_20260217_091320.json"
      mp4_paths:
        "18486638": "/path/to/YFVDatafile_20260217_091320.18486638.mp4"
